name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Windows only: the transport is COM.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Windows ships Pester 3.4 in Program Files, and it will be auto-loaded ahead
      # of anything newer depending on PSModulePath order. Pester 3 does not
      # understand BeforeAll or `Should -Be`, so every test "fails" for the wrong
      # reason. Install 5.x and import it by version, explicitly, everywhere.
      - name: Install Pester 5
        shell: powershell
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.0 -MaximumVersion 5.99.99 `
                         -Force -SkipPublisherCheck -Scope CurrentUser
          Get-Module -ListAvailable Pester |
            Select-Object Version, ModuleBase | Format-Table -AutoSize

      - name: Pester (Windows PowerShell 5.1)
        shell: powershell
        run: |
          Import-Module Pester -MinimumVersion 5.0 -MaximumVersion 5.99.99 -Force
          "using Pester $((Get-Module Pester).Version)"
          $r = Invoke-Pester -Path tests -PassThru
          "passed=$($r.PassedCount) failed=$($r.FailedCount)"
          if ($r.FailedCount -gt 0) { exit 1 }

      - name: Pester (PowerShell 7)
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.0 -MaximumVersion 5.99.99 `
                         -Force -SkipPublisherCheck -Scope CurrentUser
          Import-Module Pester -MinimumVersion 5.0 -MaximumVersion 5.99.99 -Force
          "using Pester $((Get-Module Pester).Version)"
          $r = Invoke-Pester -Path tests -PassThru
          "passed=$($r.PassedCount) failed=$($r.FailedCount)"
          if ($r.FailedCount -gt 0) { exit 1 }

      # No Adobe software on the runner. That is the point -- every app interaction
      # is behind an injectable probe.
      - name: Module loads and exports what the manifest claims
        shell: powershell
        run: |
          Import-Module .\src\AdobeScriptRunner -Force
          $m = Get-Module AdobeScriptRunner
          $declared = (Import-PowerShellDataFile .\src\AdobeScriptRunner\AdobeScriptRunner.psd1).FunctionsToExport
          $missing = $declared | Where-Object { -not $m.ExportedFunctions.ContainsKey($_) }
          if ($missing) { Write-Error "not exported: $($missing -join ', ')"; exit 1 }
          "exports $($m.ExportedFunctions.Count) functions"
